name: Build Android debug libSdk.so

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK and native library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Install Android toolchain
        run: |
          sdkmanager --sdk_root="${ANDROID_HOME}" --install \
            "platform-tools" "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"
          yes | sdkmanager --sdk_root="${ANDROID_HOME}" --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect libSdk.so
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/libSdk
          mapfile -t libraries < <(find app/build -type f -name "libSdk.so" | sort)
          if [ "${#libraries[@]}" -eq 0 ]; then
            echo "libSdk.so was not produced"
            exit 1
          fi
          for library in "${libraries[@]}"; do
            abi="$(basename "$(dirname "$library")")"
            mkdir -p "artifacts/libSdk/$abi"
            cp "$library" "artifacts/libSdk/$abi/libSdk.so"
          done
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/
          printf 'Collected libraries:\n'
          find artifacts -type f -print

      - name: Upload libSdk.so and APK
        uses: actions/upload-artifact@v4
        with:
          name: modern-imgui-android-debug
          path: artifacts/
          if-no-files-found: error
          retention-days: 14